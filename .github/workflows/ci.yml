name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - name: start local stack (migrations + seed)
        run: supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,mailpit,supavisor
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bcn-services/data-client build
      - name: worker image builds
        run: docker build -f worker/Dockerfile -t bcns-data-worker:ci .
      - if: always()
        run: supabase stop --no-backup
